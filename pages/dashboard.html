<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内部看板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; background: #fafafa; color: #1a1a1a; min-height: 100vh; }
  .layout { padding: 50px 250px; margin: 0 64px; }
  .back { display: inline-block; font-size: 13px; color: #999; text-decoration: none; margin-bottom: 16px; }
  .back:hover { color: #333; }
  .title { font-size: 56px; font-weight: 700; margin-bottom: 40px; }
  .section-label { font-size: 20px; font-weight: 900; text-transform: uppercase; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
  .card { display: flex; padding: 2px; border-radius: 4px; text-decoration: none; color: inherit; cursor: pointer; transition: background 0.12s; margin-bottom: 20px; align-items: flex-start; }
  .card:hover { background: rgba(0,0,0,0.04); }
  .card svg { width: 27px; height: 35px; fill: #1a1a1a; display: block; flex-shrink: 0; }
  .card h5 { font-size: 14px; font-weight: 500; margin-bottom: -4px; }
  .card span { font-size: 11px; color: #999; }
  .footer { text-align: center; font-size: 11px; color: #ccc; margin-top: 56px; padding-bottom: 24px; }
  @media (max-width: 900px) { .layout { padding: 50px 24px; margin: 0; } .grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="layout">
  <a class="back" href="/">← 返回</a>

  <div class="section-label">看板</div>
  <div class="grid">
    <a class="card" id="scheduleLink" href="/sedn-dashboard/schedule/">

      <div><h5>排产看板</h5><span>生产排产进度</span></div>
    </a>
    <a class="card" href="https://m3.sedn-group.com">

      <div><h5>数据看板</h5><span>车间每日产出</span></div>
    </a>

      <div><h5>生产进度表</h5><span>订单进度 · M3自动填充</span></div>
    </a>
    <a class="card" href="https://order-progress.sedn-group.com/">

    </a>
  </div>
  <div class="footer">身份已验证 · 7天内免登录</div>
</div>
<script>
async function go(el, dir, prefix) {
  try {
    const r = await fetch('https://api.github.com/repos/imthefirstuser/sedn-dashboard/contents/' + dir);
    const d = await r.json();
    const num = s => { const m = s.match(/_(\d+)\.html/); return m ? parseInt(m[1]) : -1; };
    const f = d.filter(x => x.type === 'file' && x.name.startsWith(prefix)).sort((a,b) => num(b.name) - num(a.name))[0];
    if (f) el.href = '/sedn-dashboard/' + dir + '/' + f.name;
  } catch(e) {}
}
go(document.getElementById('scheduleLink'), 'schedule', 'schedule_');
go(document.getElementById('alertLink'), 'alert', 'alert_');
</script>
