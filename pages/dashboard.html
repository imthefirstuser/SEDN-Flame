<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEDN 内部看板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; min-height: 100vh; }
  .header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 20px 32px; }
  .header h1 { font-size: 20px; font-weight: 600; }
  .header p { font-size: 13px; color: #888; margin-top: 4px; }
  .container { max-width: 960px; margin: 0 auto; padding: 24px 32px; }
  .section { margin-bottom: 32px; }
  .section-title { font-size: 14px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .card { background: #fff; border: 1px solid #e8e8e8; border-radius: 8px; padding: 16px 20px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: inherit; transition: border-color 0.15s; }
  .card:hover { border-color: #4a90d9; }
  .card-left { display: flex; align-items: center; gap: 12px; }
  .card-icon { font-size: 24px; width: 36px; text-align: center; }
  .card-name { font-size: 15px; font-weight: 500; }
  .card-desc { font-size: 12px; color: #999; margin-top: 2px; }
  .card-arrow { color: #ccc; font-size: 18px; }
  .footer { font-size: 11px; color: #bbb; text-align: right; margin-top: 40px; padding-bottom: 20px; }
</style>
</head>
<body>

<div class="header">
  <h1>内部看板</h1>
  <p>排产·告警·成本·采购 — 自动展示最新</p>
</div>

<div class="container">
  <div class="section">
    <div class="section-title">看板</div>
    <a class="card" href="https://imthefirstuser.github.io/sedn-dashboard/index.html" target="_blank">
      <div class="card-left">
        <span class="card-icon">🖥️</span>
        <div>
          <div class="card-name">内部功能平台</div>
          <div class="card-desc">排产看板·全线告警·成本报表·采购报表</div>
        </div>
      </div>
      <span class="card-arrow">›</span>
    </a>
    <a class="card" href="https://imthefirstuser.github.io/sedn-dashboard/schedule/" target="_blank">
      <div class="card-left">
        <span class="card-icon">📅</span>
        <div>
          <div class="card-name">排产看板</div>
          <div class="card-desc">生产排产进度</div>
        </div>
      </div>
      <span class="card-arrow">›</span>
    </a>
    <a class="card" href="https://imthefirstuser.github.io/sedn-dashboard/alert/" target="_blank">
      <div class="card-left">
        <span class="card-icon">⚠️</span>
        <div>
          <div class="card-name">全线告警</div>
          <div class="card-desc">生产异常告警</div>
        </div>
      </div>
      <span class="card-arrow">›</span>
    </a>
    <a class="card" href="https://imthefirstuser.github.io/sedn-dashboard/cost_report.html" target="_blank">
      <div class="card-left">
        <span class="card-icon">💰</span>
        <div>
          <div class="card-name">成本报表</div>
          <div class="card-desc">725品号汇总统计表</div>
        </div>
      </div>
      <span class="card-arrow">›</span>
    </a>
  </div>

  <div class="section">
    <div class="section-title">采购</div>
    <a class="card" href="https://imthefirstuser.github.io/sedn-dashboard/purchase_2b.html" target="_blank">
      <div class="card-left">
        <span class="card-icon">📋</span>
        <div>
          <div class="card-name">304#2B 采购明细看板</div>
          <div class="card-desc">304#2B 板材采购明细·价格·供应商对比</div>
        </div>
      </div>
      <span class="card-arrow">›</span>
    </a>
  </div>

  <div class="footer">身份已验证 · 7天内免登录</div>
</div>

</body>
</html>
