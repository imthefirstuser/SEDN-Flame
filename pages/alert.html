<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全线告警</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: #fafafa; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #999; font-size: 14px; }
</style>
</head>
<body>
正在跳转到最新告警...
<script>
fetch('https://api.github.com/repos/imthefirstuser/sedn-dashboard/contents/alert')
  .then(r => r.json())
  .then(files => {
    const latest = files
      .filter(f => f.type === 'file' && /^alert_/.test(f.name))
      .sort((a, b) => b.name.localeCompare(a.name))[0];
    if (latest) {
      window.location.href = '/sedn-dashboard/alert/' + latest.name;
    } else {
      document.body.textContent = '暂无告警数据';
    }
  })
  .catch(() => { document.body.textContent = '加载失败'; });
</script>
</body>
</html>
