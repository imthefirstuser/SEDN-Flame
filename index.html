<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEDN 内部平台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; background: #fafafa; color: #1a1a1a; min-height: 100vh; }
  .container { max-width: 680px; margin: 0 auto; padding: 48px 24px; }
  .greeting { font-size: 28px; font-weight: 300; letter-spacing: -0.5px; margin-bottom: 4px; }
  .date { font-size: 13px; color: #999; margin-bottom: 48px; }
  .section-label { font-size: 11px; font-weight: 600; color: #bbb; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 16px; }
  .card { display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: 10px; text-decoration: none; color: #1a1a1a; transition: background 0.15s; margin-bottom: 6px; background: #fff; border: 1px solid #eee; }
  .card:hover { background: #f0f0f0; border-color: #ddd; }
  .card-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .card-icon svg { width: 20px; height: 20px; }
  .card-icon.blue { background: #eff6ff; }
  .card-icon.blue svg { fill: #3b82f6; }
  .card-icon.green { background: #f0fdf4; }
  .card-icon.green svg { fill: #22c55e; }
  .card-body h5 { font-size: 15px; font-weight: 500; margin-bottom: 2px; }
  .card-body span { font-size: 12px; color: #999; }
  .footer { text-align: center; font-size: 11px; color: #ccc; margin-top: 56px; padding-bottom: 24px; }
</style>
</head>
<body>

<div class="container">
  <div class="greeting" id="greet"></div>
  <div class="date" id="dateStr"></div>

  <div class="section-label">应用</div>

  <a class="card" href="/pages/dashboard.html">
    <div class="card-icon blue">
      <svg viewBox="0 0 24 24"><path d="M13,3V9H21V3M13,21H21V11H13M3,21H11V15H3M3,13H11V3H3V13Z"/></svg>
    </div>
    <div class="card-body">
      <h5>内部看板</h5>
      <span>排产 · 告警 · 成本 · 采购</span>
    </div>
  </a>

  <a class="card" href="/pages/tools.html">
    <div class="card-icon green">
      <svg viewBox="0 0 24 24"><path d="M22.7,19L13.6,9.9C14.5,7.6 14,4.9 12.1,3C10.1,1 7.1,0.6 4.7,1.7L9,6L6,9L1.6,4.7C0.4,7.1 0.9,10.1 2.9,12.1C4.8,14 7.5,14.5 9.8,13.6L18.9,22.7C19.3,23.1 19.9,23.1 20.3,22.7L22.6,20.4C23.1,20 23.1,19.3 22.7,19Z"/></svg>
    </div>
    <div class="card-body">
      <h5>工具</h5>
      <span>采购明细比价 · 历史查询</span>
    </div>
  </a>

  <div class="footer">SEDN 内部平台</div>
</div>

<script>
const h = new Date().getHours();
const greet = h < 12 ? '早上好' : h < 18 ? '下午好' : '晚上好';
document.getElementById('greet').textContent = greet;
const d = new Date();
const days = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
document.getElementById('dateStr').textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${days[d.getDay()]}`;
</script>
</body>
</html>
