<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEDN 内部平台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #242b33; color: #fff; min-height: 100vh; }
  .container { max-width: 680px; margin: 0 auto; padding: 40px 24px; }
  .greeting { font-size: 32px; font-weight: 300; margin-bottom: 8px; }
  .date { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 40px; }
  .section-label { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 16px; }
  .card { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-radius: 6px; text-decoration: none; color: #fff; transition: background 0.15s; margin-bottom: 4px; }
  .card:hover { background: rgba(255,255,255,0.06); }
  .card-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .card-icon svg { width: 22px; height: 22px; fill: #fff; }
  .card-icon.blue { background: #3b82f6; }
  .card-icon.green { background: #22c55e; }
  .card-icon.purple { background: #a855f7; }
  .card-icon.orange { background: #f97316; }
  .card-icon.red { background: #ef4444; }
  .card-icon.teal { background: #14b8a6; }
  .card-body h5 { font-size: 15px; font-weight: 500; margin-bottom: 2px; }
  .card-body span { font-size: 12px; color: rgba(255,255,255,0.45); }
  .footer { text-align: center; font-size: 11px; color: rgba(255,255,255,0.25); margin-top: 48px; padding-bottom: 24px; }
</style>
</head>
<body>

<div class="container">
  <div class="greeting" id="greet"></div>
  <div class="date" id="dateStr"></div>

  <div class="section-label">应用</div>

  <a class="card" href="/pages/dashboard.html">
    <div class="card-icon blue">
      <svg viewBox="0 0 24 24"><path d="M13,3V9H21V3M13,21H21V11H13M3,21H11V15H3M3,13H11V3H3V13Z"/></svg>
    </div>
    <div class="card-body">
      <h5>内部看板</h5>
      <span>排产 · 告警 · 成本 · 采购</span>
    </div>
  </a>

  <a class="card" href="/pages/tools.html">
    <div class="card-icon green">
      <svg viewBox="0 0 24 24"><path d="M22.7,19L13.6,9.9C14.5,7.6 14,4.9 12.1,3C10.1,1 7.1,0.6 4.7,1.7L9,6L6,9L1.6,4.7C0.4,7.1 0.9,10.1 2.9,12.1C4.8,14 7.5,14.5 9.8,13.6L18.9,22.7C19.3,23.1 19.9,23.1 20.3,22.7L22.6,20.4C23.1,20 23.1,19.3 22.7,19Z"/></svg>
    </div>
    <div class="card-body">
      <h5>工具</h5>
      <span>采购明细比价 · 历史查询 · 更多工具</span>
    </div>
  </a>

  <div class="footer">SEDN 内部平台 · 受保护访问</div>
</div>

<script>
const h = new Date().getHours();
const greet = h < 12 ? '早上好！' : h < 18 ? '下午好！' : '晚上好！';
document.getElementById('greet').textContent = greet;
const d = new Date();
const days = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
document.getElementById('dateStr').textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${days[d.getDay()]}`;
</script>
</body>
</html>
