<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEDN 内部平台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; background: #fafafa; color: #1a1a1a; min-height: 100vh; }
  .layout { padding: 50px 250px; margin: 0 64px; }
  .greeting { font-size: 56px; font-weight: 700; margin-bottom: 0; }
  .date { font-size: 14px; color: #999; margin-bottom: 40px; }
  .section-label { font-size: 20px; font-weight: 900; text-transform: uppercase; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
  .card { display: flex; padding: 2px; border-radius: 4px; text-decoration: none; color: inherit; cursor: pointer; transition: background 0.12s; margin-bottom: 20px; align-items: flex-start; }
  .card:hover { background: rgba(0,0,0,0.04); }
  .card svg { width: 27px; height: 35px; fill: #1a1a1a; display: block; flex-shrink: 0; }
  .card h5 { font-size: 14px; font-weight: 500; margin-bottom: -4px; color: #1a1a1a; }
  .card span { font-size: 11px; color: #999; }
  .footer { text-align: center; font-size: 11px; color: #ccc; margin-top: 56px; padding-bottom: 24px; }
  @media (max-width: 900px) { .layout { padding: 50px 24px; margin: 0; } .grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>

<div class="layout">
  <div class="greeting" id="greet"></div>
  <div class="date" id="dateStr"></div>

  <div class="section-label">应用</div>
  <div class="grid">
    <a class="card" href="/pages/dashboard.html">
      <svg viewBox="0 0 24 24"><path d="M13,3V9H21V3M13,21H21V11H13M3,21H11V15H3M3,13H11V3H3V13Z"/></svg>
      <div>
        <h5>内部看板</h5>
        <span>排产 · 告警 · 成本 · 采购</span>
      </div>
    </a>
    <a class="card" href="https://data.sedn-group.com/business.html">
      <svg viewBox="0 0 24 24"><path d="M3,3H21V21H3V3M5,5V19H19V5H5M7,7H17V9H7V7M7,11H17V13H7V11M7,15H17V17H7V15Z"/></svg>
      <div>
        <h5>服务中心</h5>
        <span>M2 库存 · 订单 · 成本</span>
      </div>
    </a>
    <a class="card" href="/pages/tools.html">
      <svg viewBox="0 0 24 24"><path d="M22.7,19L13.6,9.9C14.5,7.6 14,4.9 12.1,3C10.1,1 7.1,0.6 4.7,1.7L9,6L6,9L1.6,4.7C0.4,7.1 0.9,10.1 2.9,12.1C4.8,14 7.5,14.5 9.8,13.6L18.9,22.7C19.3,23.1 19.9,23.1 20.3,22.7L22.6,20.4C23.1,20 23.1,19.3 22.7,19Z"/></svg>
      <div>
        <h5>工具</h5>
        <span>采购明细比价 · 历史查询</span>
      </div>
    </a>
    <a class="card" href="https://procurement.sedn-group.com">
      <svg viewBox="0 0 24 24"><path d="M7,18A2,2 0 0,1 9,20A2,2 0 0,1 7,22A2,2 0 0,1 5,20A2,2 0 0,1 7,18M17,18A2,2 0 0,1 19,20A2,2 0 0,1 17,22A2,2 0 0,1 15,20A2,2 0 0,1 17,18M7.17,14.75L7.2,14.63L8.1,13H15.55C16.3,13 16.96,12.5 17.14,11.77L20.16,5.25C20.34,4.84 20,4.38 19.55,4.38H5.21L4.27,2.5H1V4.38H3L6.6,11.59L5.25,14.04C5.06,14.37 5.22,14.75 5.58,14.75H19V16.75H7C6.65,16.75 6.33,16.56 6.2,16.23L5.97,15.63"/></svg>
      <div>
        <h5>采购管理</h5>
        <span>需求计算 · 订单跟踪 · 供应商</span>
      </div>
    </a>
  </div>

  <div class="footer">SEDN 内部平台</div>
</div>

<script>
const h = new Date().getHours();
const greet = h < 12 ? '早上好' : h < 18 ? '下午好' : '晚上好';
document.getElementById('greet').textContent = greet;
const d = new Date();
const days = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
document.getElementById('dateStr').textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${days[d.getDay()]}`;
</script>
</body>
</html>
